name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Estrai il progetto Android
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q FrontlineCommander_CloudBuild.zip -d buildsrc

      - name: Compila APK
        working-directory: buildsrc
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
